<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Hand-Controlled Cube Room</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  video { display: none; }
  canvas { display: block; }
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<!-- MEDIAPIPE -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
// ==================================================
// THREE.JS SETUP
// ==================================================
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 1.5, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ==================================================
// LIGHTING
// ==================================================
scene.add(new THREE.AmbientLight(0xffffff, 0.4));

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

// ==================================================
// 3D ROOM (GRID)
// ==================================================
const roomSize = 10;

// Floor
const floorGrid = new THREE.GridHelper(roomSize, 20, 0x4444ff, 0x222244);
floorGrid.position.y = 0;
scene.add(floorGrid);

// Back wall
const backWall = new THREE.GridHelper(roomSize, 20, 0x4444ff, 0x222244);
backWall.rotation.x = Math.PI / 2;
backWall.position.z = -roomSize / 2;
backWall.position.y = roomSize / 2;
scene.add(backWall);

// Left wall
const leftWall = backWall.clone();
leftWall.rotation.z = Math.PI / 2;
leftWall.position.x = -roomSize / 2;
leftWall.position.z = 0;
scene.add(leftWall);

// Right wall
const rightWall = backWall.clone();
rightWall.rotation.z = Math.PI / 2;
rightWall.position.x = roomSize / 2;
rightWall.position.z = 0;
scene.add(rightWall);

// ==================================================
// CUBE
// ==================================================
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(0.6, 0.6, 0.6),
  new THREE.MeshStandardMaterial({
    color: 0x00ffff,
    roughness: 0.3,
    metalness: 0.2
  })
);
cube.position.set(0, 1, 0);
scene.add(cube);

// ==================================================
// MEDIAPIPE HANDS
// ==================================================
const video = document.getElementById("video");
navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => video.srcObject = stream);

let handsLandmarks = [];

const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.7
});

hands.onResults(results => {
  handsLandmarks = results.multiHandLandmarks || [];
});

const cam = new Camera(video, {
  onFrame: async () => {
    await hands.send({ image: video });
  },
  width: 640,
  height: 480
});
cam.start();

// ==================================================
// HAND → CUBE CONTROL (NO GRAB)
// ==================================================
const target = {
  x: 0,
  y: 1,
  z: 0
};

function animate() {
  requestAnimationFrame(animate);

  if (handsLandmarks.length) {
    const hand = handsLandmarks[0];
    const index = hand[8];
    const wrist = hand[0];

    // Horizontal & vertical
    target.x = (0.5 - index.x) * 6;
    target.y = (0.5 - index.y) * 4;

    // Push / pull via hand size
    const handScale = Math.hypot(
      wrist.x - index.x,
      wrist.y - index.y
    );

    target.z = THREE.MathUtils.clamp(
      (0.2 - handScale) * 12,
      -4,
      4
    );
  }

  // Smooth interpolation
  cube.position.x = THREE.MathUtils.lerp(cube.position.x, target.x, 0.12);
  cube.position.y = THREE.MathUtils.lerp(cube.position.y, target.y, 0.12);
  cube.position.z = THREE.MathUtils.lerp(cube.position.z, target.z, 0.12);

  renderer.render(scene, camera);
}

animate();

// ==================================================
// RESIZE
// ==================================================
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
