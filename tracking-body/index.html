<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cartoon Skeleton Pose</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #111;
  }
  video {
    display: none;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
  }
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ------------------------------
// Camera setup
// ------------------------------
navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => video.srcObject = stream);

// ------------------------------
// Pose
// ------------------------------
const pose = new Pose({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`
});

pose.setOptions({
  modelComplexity: 1,
  smoothLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

let poseLandmarks = [];

pose.onResults(results => {
  poseLandmarks = results.poseLandmarks || [];
});

// ------------------------------
// MediaPipe camera
// ------------------------------
const cam = new Camera(video, {
  onFrame: async () => {
    await pose.send({ image: video });
  },
  width: 640,
  height: 480
});
cam.start();

// ------------------------------
// Skeleton connections
// ------------------------------
const connections = [
  [0, 11], [0,12], // head to shoulders
  [11,12], [11,13], [12,14], [13,15], [14,16], // arms
  [11,23], [12,24], [23,24], // torso
  [23,25], [24,26], [25,27], [26,28], [27,29], [28,30], [29,31], [30,32] // legs
];

// ------------------------------
// Draw cartoon skeleton
// ------------------------------
function drawSkeleton() {
  if (!poseLandmarks.length) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw bones
  ctx.strokeStyle = "lime";
  ctx.lineWidth = 6;
  connections.forEach(pair => {
    const [i,j] = pair;
    if (!poseLandmarks[i] || !poseLandmarks[j]) return;
    const x1 = (1 - poseLandmarks[i].x) * canvas.width;
    const y1 = poseLandmarks[i].y * canvas.height;
    const x2 = (1 - poseLandmarks[j].x) * canvas.width;
    const y2 = poseLandmarks[j].y * canvas.height;

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  });

  // Draw joints
  poseLandmarks.forEach(lm => {
    const x = (1 - lm.x) * canvas.width;
    const y = lm.y * canvas.height;
    ctx.fillStyle = "orange";
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, Math.PI*2);
    ctx.fill();
  });
}

// ------------------------------
// Animate
// ------------------------------
function animate() {
  requestAnimationFrame(animate);
  drawSkeleton();
}

animate();

// ------------------------------
window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

</body>
</html>
